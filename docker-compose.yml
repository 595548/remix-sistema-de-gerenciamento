version: '3.8'

services:
  biblioteca-valdiva-colaco:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: biblioteca_valdiva_colaco_app
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    env_file:
      - .env.example
    restart: unless-stopped
